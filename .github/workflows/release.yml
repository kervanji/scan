name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build Windows release
        shell: bash
        env:
          RUNNER_OS: Windows
        run: |
          chmod +x scripts/build-release.sh
          PLATFORM=win ./scripts/build-release.sh "${{ steps.version.outputs.VERSION }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }} (Windows)
          files: |
            release-output/qr-attendance-${{ steps.version.outputs.VERSION }}-win.zip
          generate_release_notes: true

      - name: Commit version.json
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add updates/version.json
          git diff --staged --quiet || git commit -m "chore: update version.json for ${{ github.ref_name }}"
          git push

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build Mac release
        run: |
          chmod +x scripts/build-release.sh
          PLATFORM=mac-aarch64 ./scripts/build-release.sh "${{ steps.version.outputs.VERSION }}"

      - name: Upload Mac zip to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-output/qr-attendance-${{ steps.version.outputs.VERSION }}-mac-aarch64.zip
