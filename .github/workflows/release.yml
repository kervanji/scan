name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build JAR
        run: mvn -B clean package -DskipTests

      - name: Compute SHA256
        id: sha
        run: |
          SHA=$(shasum -a 256 target/qr-attendance-${{ steps.version.outputs.VERSION }}.jar | awk '{print $1}')
          echo "SHA=$SHA" >> $GITHUB_OUTPUT

      - name: Update version.json
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          SHA="${{ steps.sha.outputs.SHA }}"
          REPO="${{ github.repository }}"
          cat > updates/version.json << EOF
          {
            "version": "${VERSION}",
            "downloadUrl": "https://github.com/${REPO}/releases/download/v${VERSION}/qr-attendance-${VERSION}.jar",
            "sha256": "${SHA}",
            "releaseNotes": "Release v${VERSION}",
            "mandatory": false,
            "minVersion": "1.0.0"
          }
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: target/qr-attendance-${{ steps.version.outputs.VERSION }}.jar
          generate_release_notes: true

      - name: Commit version.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add updates/version.json
          git diff --staged --quiet || git commit -m "chore: update version.json for ${{ github.ref_name }}"
          git push
